name: Run Dependabot Core on Custom Branch

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to analyze"
        required: true
        default: "develop"

jobs:
  dependabot-core:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2

      - name: Install dependabot-core
        run: |
          gem install dependabot-core dependabot-omnibus

      - name: Run Dependabot Core
        env:
          GITHUB_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: ${{ github.event.inputs.branch }}
        run: |
          # Example: run for npm
          bundle exec ruby -Ilib ./bin/dependabot.rb npm_and_yarn / $TARGET_BRANCH
